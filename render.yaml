services:
  - type: web
    name: limx-monochrome
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=400
      - key: PORT
        value: 8080
      - key: HOST
        value: 0.0.0.0
      - key: DEFAULT_AUDIO_QUALITY
        value: LOSSLESS
